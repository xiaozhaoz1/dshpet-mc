// common —— 平台中立源码 (Stonecutter 按节点剥离)。本 mod 为纯客户端, 无第三方依赖。
plugins {
    id 'com.iamkaf.multiloader.common'
}

def minecraftVersion = project.name

repositories {
    mavenCentral()
}

dependencies {
    // 纯 JVM 单测 (不碰 MC 类型的那部分: Animator / 配置合并 / 回退逻辑)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ? if 1.20.1 {
    //   (无第三方依赖 — 1.20.1 节点同样零 compileOnly)
    // ?}
}

test {
    useJUnitPlatform()
}

// javadoc 读 UTF-8 源 (Windows GBK 默认会让中文注释报错)
tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}

// 中文资源/文案: 源文件一律显式 UTF-8 (错题 #247: 编码损坏只在 clean 重打后暴露)
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
