动画素材来自上游 PC2005-cloud/dsh-pet（v0.2.11，https://github.com/PC2005-cloud/dsh-pet）：
允许开源使用、禁止商用；二创作品须署名原作者。待机/点击/拖拽/甩抛/多开/屏幕漫游，
