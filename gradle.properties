org.gradle.jvmargs=-Xmx4G
org.gradle.workers.max=4
org.gradle.parallel=true

# ── Shared project metadata ──────────────────────────────────────────────────
project.group=com.github.xiaozhaoz1
# multiloader settings 插件版本 (与 LMA-MAIN 一致 —— 该版本已在本机 gradle 缓存, 可离线解析)
project.plugins=2.1.2

# ── Mod metadata ────────────────────────────────────────────────────────────
mod.name=DSH Pet
mod.authors=xiaozhaoz1
mod.id=dshpet
mod.license=MIT (code only; bundled animation assets are NOT MIT — non-commercial, see THIRD-PARTY-NOTICES.md)
mod.credits=Animation assets from PC2005-cloud/dsh-pet v0.2.11 (https://github.com/PC2005-cloud/dsh-pet) — assets are open-source usable but NON-COMMERCIAL; derivative works must credit the original author
mod.description=A client-side desktop pet for Minecraft, ported from dsh-pet.

# ── Publishing defaults ─────────────────────────────────────────────────────
# ⚠️ 上游动画素材许可为「允许开源使用，禁止商用」⇒ 本项目默认 dry-run（不自动发布）。
#    若将来要发布到 CurseForge/Modrinth，必须先确认发布形态符合上游素材条款（禁止商用），
#    并在发布页带上原作者地址 https://github.com/PC2005-cloud/dsh-pet（二创署名要求）。
publish.dry-run=true
publish.curseforge.id=000
publish.modrinth.id=xxx
publish.release-type=release
publish.game-versions=auto

# 纯客户端 mod: 服务端不需要装 (HUD 渲染 + 本地配置)
environments.client=required
environments.server=unsupported

# 本机构建依赖说明 (与 LMA 同约定):
#  - JDK 21: settings 插件要求 21+; 编译 toolchain 按节点 project.java
#  - 本机 JDK 路径与代理配置在 ~/.gradle/gradle.properties (不随仓库分发)
